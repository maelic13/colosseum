# Flatpak manifest for Colosseum — Chess Engine Testing Suite
#
# Build instructions:
#
#   1. Install flatpak-builder and the GNOME SDK:
#        flatpak install flathub org.gnome.Platform//46 org.gnome.Sdk//46
#        flatpak install flathub org.freedesktop.Sdk.Extension.rust-stable//24.08
#
#   2. Fetch Cargo dependencies into a local mirror (required for offline build):
#        cargo vendor vendor/
#        # Then add the vendor config to .cargo/config.toml:
#        mkdir -p .cargo
#        cat >> .cargo/config.toml <<EOF
#        [source.crates-io]
#        replace-with = "vendored-sources"
#        [source.vendored-sources]
#        directory = "vendor"
#        EOF
#
#   3. Build and install locally:
#        flatpak-builder --force-clean build-dir flatpak/com.colosseum.Colosseum.yml
#        flatpak-builder --user --install --force-clean build-dir \
#          flatpak/com.colosseum.Colosseum.yml
#
#   4. Run:
#        flatpak run com.colosseum.Colosseum
#
# For Flathub submission the vendor/ directory must be pre-generated and the
# sha256sum of the source archive added to the manifest. See:
#   https://docs.flathub.org/docs/for-app-authors/submission

app-id: com.colosseum.Colosseum
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: colosseum

finish-args:
  # Wayland + X11 fallback
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU acceleration (egui renders via wgpu/OpenGL)
  - --device=dri
  # Read engine executables and opening books anywhere under $HOME
  - --filesystem=home:ro
  # Write tournament databases and PGN output under $HOME
  - --filesystem=home
  # No network access needed (engines run locally)

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/colosseum/cargo
    RUST_BACKTRACE: '1'

modules:
  # ── GTK 3 / XCB / XKB — required by eframe on Linux ─────────────────────
  # These are already provided by the GNOME Platform runtime at version 46.

  # ── Colosseum binary ──────────────────────────────────────────────────────
  - name: colosseum
    buildsystem: simple
    build-commands:
      # Pre-fetch dependencies (requires vendor/ directory — see instructions above)
      - cargo --offline fetch --manifest-path Cargo.toml --verbose

      # Build the release binary
      - cargo --offline build --release --bin colosseum

      # Install binary
      - install -Dm755 target/release/colosseum /app/bin/colosseum

      # Desktop entry
      - install -Dm644 flatpak/com.colosseum.Colosseum.desktop
          /app/share/applications/com.colosseum.Colosseum.desktop

      # AppStream metadata
      - install -Dm644 flatpak/com.colosseum.Colosseum.metainfo.xml
          /app/share/metainfo/com.colosseum.Colosseum.metainfo.xml

    sources:
      - type: dir
        path: ..
        # Exclude build artifacts and dev files
        skip:
          - target
          - .git
          - .claude
