[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/"
authors = ["Miloslav Macůrek <macurek.m@gmail.com>"]

# Release profile: optimize the shipped binary; engine I/O timing benefits from opt builds.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
