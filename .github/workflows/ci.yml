# CI — the hermetic workspace on every supported OS, debug and optimized.
#
# This is the mandatory gate into main. It runs on a pull request into main,
# where GitHub builds the merge commit, so the run tests exactly what main
# would become, and on manual dispatch for any branch. It does not run on
# pushes: a push to main only ever lands a pull request that already passed.
# A newer commit to the same pull request cancels the superseded run.
#
# The release workflows (release-cli.yml, release-gui.yml) run beside it on
# the same pull request and build every release artifact as a candidate, so a
# pull request green in all three is one the tag will release.

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Timeouts stop a stalled runner, not a slow test: each is about three
  # times the slowest successful run to 2026-10-29 (15 minutes).
  quality:
    name: Format, architecture and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # eframe/egui needs GTK + XCB headers on Linux.
      - name: Install Linux GUI dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check generated CLI documentation
        run: cargo run -p colosseum-docs -- --check

      - name: Check workspace tests
        run: cargo check --workspace --tests

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build independent headless CLI artifact
        run: cargo build --release -p colosseum-cli --bin colosseum-cli

  platform-tests:
    name: ${{ matrix.os }} / ${{ matrix.profile }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        profile: [debug, release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      # Both matrix legs of one OS are the same job, so without this they share
      # a cache key: they race to save it, the loser never saves, and every run
      # of that leg rebuilds the whole graph from cold.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile }}

      - name: Run required hermetic tests (debug)
        if: matrix.profile == 'debug'
        run: cargo test --workspace --all-targets

      # `ci-release` is the shipped release profile without the distribution-only
      # LTO and single-codegen-unit settings; see the workspace manifest.
      - name: Run required hermetic tests (release)
        if: matrix.profile == 'release'
        run: cargo test --workspace --all-targets --profile ci-release

  # ---- One required check for the whole workflow ----------------------------
  # Branch protection requires this job, not the matrix cells, so the required
  # set does not change with the matrix. It always runs and fails unless every
  # job it needs succeeded: GitHub reports a job skipped after a failed
  # dependency as passing, so a required job must never be skipped.
  complete:
    name: CI complete
    needs: [quality, platform-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every CI job succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          exit ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')) && 1 || 0 }}
