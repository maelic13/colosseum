name: Colosseum CLI candidate and release
run-name: CLI ${{ github.ref_type == 'tag' && github.ref_name || format('candidate {0}', github.sha) }}

on:
  workflow_dispatch:
  push:
    branches:
      - cli
    tags:
      - 'cli-v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  required-ci:
    name: Required workspace gates
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[cli candidate]')
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Validate immutable source
    needs: required-ci
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.metadata.outputs.mode }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-cli-metadata

      - name: Validate version and release ownership
        id: metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            metadata="$(cargo run --locked -q -p colosseum-release -- "$GITHUB_REF_NAME")"
            mode=release
          else
            metadata="$(cargo run --locked -q -p colosseum-release -- candidate cli)"
            mode=candidate
          fi
          test "$(jq -r .product <<<"$metadata")" = cli
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version <<<"$metadata")" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(jq -r .prerelease <<<"$metadata")" >> "$GITHUB_OUTPUT"
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "$metadata"

      - name: Reject forbidden CLI dependency edges
        run: cargo test --locked -p colosseum-cli --test architecture

      - name: Verify version-matched offline documentation
        run: cargo run --locked -p colosseum-docs -- --check

  build:
    name: Archive and smoke (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x86_64
            extension: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows
            arch: arm64
            extension: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x86_64
            extension: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: aarch64
            extension: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-cli-${{ matrix.target }}

      - name: Build only the headless CLI product
        run: cargo build --locked --release -p colosseum-cli --bin colosseum-cli --target ${{ matrix.target }}

      - name: Stage the allowlisted archive contents
        shell: pwsh
        run: |
          $suffix = if ('${{ matrix.platform }}' -eq 'windows') { '.exe' } else { '' }
          $binary = "target/${{ matrix.target }}/release/colosseum-cli$suffix"
          cargo run --locked -q -p colosseum-release -- stage-cli `
            '${{ needs.prepare.outputs.version }}' `
            '${{ matrix.platform }}' `
            '${{ matrix.arch }}' `
            $binary `
            dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create ZIP
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $name = 'colosseum-cli-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}'
          Compress-Archive -LiteralPath "dist/$name" -DestinationPath "$name.zip"

      - name: Create tar.gz
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          name='colosseum-cli-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}'
          tar -C dist -czf "${name}.tar.gz" "$name"

      - name: Smoke the exact final archive from an isolated directory
        shell: pwsh
        run: |
          ./tools/release/Smoke-CliArchive.ps1 `
            -Archive 'colosseum-cli-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.extension }}' `
            -Version '${{ needs.prepare.outputs.version }}' `
            -Platform '${{ matrix.platform }}' `
            -Architecture '${{ matrix.arch }}'

      - name: Upload exact platform archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-archive-${{ matrix.platform }}-${{ matrix.arch }}
          path: colosseum-cli-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 30

  collect:
    name: Verify and retain exact bundle
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Download all exact platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cli-archive-*
          merge-multiple: true
          path: release-artifacts

      - name: Verify the complete matrix and generate checksums
        shell: bash
        run: |
          version='${{ needs.prepare.outputs.version }}'
          expected=(
            "colosseum-cli-${version}-windows-x86_64.zip"
            "colosseum-cli-${version}-windows-arm64.zip"
            "colosseum-cli-${version}-linux-x86_64.tar.gz"
            "colosseum-cli-${version}-macos-aarch64.tar.gz"
          )
          test "$(find release-artifacts -maxdepth 1 -type f | wc -l)" -eq 4
          for file in "${expected[@]}"; do test -f "release-artifacts/$file"; done
          (cd release-artifacts && sha256sum "${expected[@]}" > SHA256SUMS)
          sha256sum --check release-artifacts/SHA256SUMS

      - name: Record immutable candidate identity
        if: needs.prepare.outputs.mode == 'candidate'
        shell: bash
        run: |
          cat > release-artifacts/CANDIDATE.json <<EOF
          {"product":"colosseum-cli","version":"${{ needs.prepare.outputs.version }}","commit":"${{ needs.prepare.outputs.source_sha }}","workflow_run":${{ github.run_id }}}
          EOF

      - name: Retain candidate bundle without publishing a release
        if: needs.prepare.outputs.mode == 'candidate'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: colosseum-cli-candidate-${{ needs.prepare.outputs.source_sha }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Add product-owned release notes to the stable bundle
        if: needs.prepare.outputs.mode == 'release'
        run: cargo run --locked -q -p colosseum-release -- notes "$GITHUB_REF_NAME" release-artifacts/RELEASE-NOTES.md

      - name: Retain verified stable bundle for the publish job
        if: needs.prepare.outputs.mode == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: colosseum-cli-release-${{ needs.prepare.outputs.source_sha }}
          path: release-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish stable or SemVer prerelease
    if: needs.prepare.outputs.mode == 'release'
    needs: [prepare, collect]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Prove the tagged commit is reachable from the default branch
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor '${{ needs.prepare.outputs.source_sha }}' origin/main

      - name: Download the verified stable bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: colosseum-cli-release-${{ needs.prepare.outputs.source_sha }}
          path: release-artifacts

      - name: Recheck downloaded archive checksums
        run: cd release-artifacts && sha256sum --check SHA256SUMS

      - name: Publish the product-scoped GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: Colosseum CLI v${{ needs.prepare.outputs.version }}
          body_path: release-artifacts/RELEASE-NOTES.md
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: |
            release-artifacts/colosseum-cli-*
            release-artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
