name: Colosseum CLI candidate and release
run-name: CLI ${{ github.ref_type == 'tag' && github.ref_name || format('candidate {0}', github.sha) }}

# A release is cut by pushing a `cli-vX.Y.Z` tag on main, or, for a patch
# while main holds unreleased work, on a branch cut from the `cli-vX.Y.0`
# release; nothing else creates one. The tag run validates first (the tag
# names the version crates/colosseum-cli/Cargo.toml declares and
# CHANGELOG-CLI.md has a dated section for it), builds, packages and smokes
# every archive read-only, and only then one job with write permission
# publishes the release with every archive and the notes taken from that
# changelog section. Nothing exists on GitHub until every cell has passed, so
# a failed run is repaired by deleting the tag, fixing main and tagging again.
#
# A pull request into main runs the same build, package and smoke as a
# candidate, so a green pull request is a releasable one. When the CLI's
# version is a plain X.Y.Z that has no tag yet, the pull request proposes that
# release, and the candidate also runs the release check (all but the tag
# itself and the commit on main). A manual dispatch does the same on a chosen
# ref, the rehearsal. Neither creates a tag or a release.

on:
  push:
    tags:
      - 'cli-v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer commit on the same pull request supersedes its candidate build; tag
# and dispatch runs are never cancelled.
concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Timeouts stop a stalled runner, not a slow build: each is about three
  # times the slowest successful run to 2026-10-29 (12 minutes).
  prepare:
    name: Validate source and packaging inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.metadata.outputs.mode }}
      version: ${{ steps.metadata.outputs.version }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
    steps:
      # The full history carries the tags, which say whether a candidate's
      # version has been released already.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-cli-metadata

      - name: Validate version and release ownership
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            metadata="$(cargo run --locked -q -p colosseum-release -- "$GITHUB_REF_NAME")"
            mode=release
          else
            metadata="$(cargo run --locked -q -p colosseum-release -- candidate cli)"
            mode=candidate
            version="$(jq -r .version <<<"$metadata")"
            tag="cli-v$version"
            # A plain version not tagged yet is a release proposal: it passes
            # every check the tag run makes before it builds.
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "proposes $tag"
              cargo run --locked -q -p colosseum-release -- "$tag"
            else
              echo "candidate of $version; nothing is proposed for release"
            fi
          fi
          test "$(jq -r .product <<<"$metadata")" = cli
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version <<<"$metadata")" >> "$GITHUB_OUTPUT"
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "$metadata"

      - name: Reject forbidden CLI dependency edges
        run: cargo test --locked -p colosseum-cli --test cli -- 'architecture::'

      - name: Verify version-matched offline documentation
        run: cargo run --locked -p colosseum-docs -- --check

  build:
    name: Archive and smoke (${{ matrix.target }})
    needs: prepare
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x64
            extension: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows
            arch: arm64
            extension: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            extension: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64
            extension: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-cli-${{ matrix.target }}

      # One entry point: the same command a maintainer runs locally builds the
      # product, stages the allowlisted contents, writes the archive to
      # target/dist/ and reads it back with the archive smoke script.
      - name: Build, package and smoke the headless CLI product
        run: cargo xtask package cli --target ${{ matrix.target }}

      - name: Upload exact platform archive
        uses: actions/upload-artifact@v7
        with:
          name: cli-archive-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/dist/colosseum-cli-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 30

  # ---- The complete matrix: the required check for this workflow ------------
  # It always runs and fails unless every job it needs succeeded, because a
  # job skipped after a failed dependency reports as passing.
  collect:
    name: Verify the complete CLI matrix
    needs: [prepare, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Every build succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          exit ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')) && 1 || 0 }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download all exact platform archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-archive-*
          merge-multiple: true
          path: release-artifacts

      - name: Verify the complete matrix and generate checksums
        shell: bash
        run: |
          version='${{ needs.prepare.outputs.version }}'
          expected=(
            "colosseum-cli-${version}-windows-x64.zip"
            "colosseum-cli-${version}-windows-arm64.zip"
            "colosseum-cli-${version}-linux-x64.tar.gz"
            "colosseum-cli-${version}-macos-arm64.tar.gz"
          )
          test "$(find release-artifacts -maxdepth 1 -type f | wc -l)" -eq 4
          for file in "${expected[@]}"; do test -f "release-artifacts/$file"; done
          (cd release-artifacts && sha256sum "${expected[@]}" > SHA256SUMS)
          (cd release-artifacts && sha256sum --check SHA256SUMS)

      - name: Record candidate identity
        if: needs.prepare.outputs.mode == 'candidate'
        shell: bash
        run: |
          cat > release-artifacts/CANDIDATE.json <<EOF
          {"product":"colosseum-cli","version":"${{ needs.prepare.outputs.version }}","commit":"${{ needs.prepare.outputs.source_sha }}","workflow_run":${{ github.run_id }}}
          EOF

      - name: Retain candidate bundle without publishing a release
        if: needs.prepare.outputs.mode == 'candidate'
        uses: actions/upload-artifact@v7
        with:
          name: colosseum-cli-candidate-${{ needs.prepare.outputs.source_sha }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Install Rust toolchain
        if: needs.prepare.outputs.mode == 'release'
        uses: dtolnay/rust-toolchain@stable

      - name: Add product-owned release notes to the stable bundle
        if: needs.prepare.outputs.mode == 'release'
        run: cargo run --locked -q -p colosseum-release -- notes "$GITHUB_REF_NAME" release-artifacts/RELEASE-NOTES.md

      - name: Retain verified stable bundle for the publish job
        if: needs.prepare.outputs.mode == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: colosseum-cli-release-${{ needs.prepare.outputs.source_sha }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 90

  # ---- Publish: a tag push only, after every check has passed ----------------
  publish:
    name: Publish stable release
    if: needs.prepare.outputs.mode == 'release' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cli-v')
    needs: [prepare, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      # On main, or on a patch line: a commit descending from this minor's
      # `cli-vX.Y.0`, which is itself on main.
      - name: Prove the tagged commit is on main or its patch line
        shell: bash
        run: |
          set -euo pipefail
          sha='${{ needs.prepare.outputs.source_sha }}'
          git fetch -q origin main
          if git merge-base --is-ancestor "$sha" origin/main; then
            echo "$GITHUB_REF_NAME is on main"; exit 0
          fi
          base="$(sed -E 's/^(cli-v[0-9]+\.[0-9]+)\.[0-9]+$/\1.0/' <<<"$GITHUB_REF_NAME")"
          git rev-parse -q --verify "refs/tags/$base" >/dev/null || { echo "::error::$GITHUB_REF_NAME is not on main and $base does not exist"; exit 1; }
          git merge-base --is-ancestor "$base" origin/main || { echo "::error::$base is not on main"; exit 1; }
          git merge-base --is-ancestor "$base" "$sha" || { echo "::error::$GITHUB_REF_NAME does not descend from $base"; exit 1; }
          echo "$GITHUB_REF_NAME is on the $base patch line"

      - name: Download the verified stable bundle
        uses: actions/download-artifact@v8
        with:
          name: colosseum-cli-release-${{ needs.prepare.outputs.source_sha }}
          path: release-artifacts

      - name: Recheck downloaded archive checksums
        run: cd release-artifacts && sha256sum --check SHA256SUMS

      - name: Publish the product-scoped GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Colosseum CLI v${{ needs.prepare.outputs.version }}
          body_path: release-artifacts/RELEASE-NOTES.md
          # GitHub keeps one repository-wide "latest" release for both products.
          # The CLI never claims it, so a CLI tag cannot displace the GUI
          # download the repository front page offers.
          make_latest: false
          # SHA256SUMS is generated and re-checked between jobs, but not
          # published: a checksum file beside the archives it describes proves
          # nothing an attacker who can replace one cannot also replace. The
          # per-asset digests GitHub records are the ones to compare against.
          files: |
            release-artifacts/colosseum-cli-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
