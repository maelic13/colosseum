name: Colosseum GUI release
# Title runs by the product-scoped tag instead of the commit message.
run-name: ${{ github.ref_name }}

on:
  push:
    tags:
      - 'gui-v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  required-ci:
    name: Required workspace gates
    uses: ./.github/workflows/ci.yml

  validate:
    name: Validate GUI release identity
    needs: required-ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Validate tag, manifest and GUI release notes
        id: metadata
        shell: bash
        run: |
          metadata="$(cargo run --locked -q -p colosseum-release -- "$GITHUB_REF_NAME")"
          test "$(jq -r .product <<<"$metadata")" = gui
          echo "version=$(jq -r .version <<<"$metadata")" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(jq -r .prerelease <<<"$metadata")" >> "$GITHUB_OUTPUT"

  # ────────────────────────────────────────────────────────────────────────────
  # Build release binaries and produce platform-specific packages
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86-64 → portable ZIP + MSI installer
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x86_64
            wix_arch: x64

          # Windows ARM64 → portable ZIP + MSI installer
          # Built natively on a GitHub-hosted Arm runner (free for public repos).
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows
            arch: arm64
            wix_arch: arm64

          # Linux x86-64 → .tar.gz + .deb + .rpm
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x86_64

          # macOS Apple Silicon → .dmg + .tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: aarch64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}

      # eframe/egui needs GTK + XCB headers on Linux
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      # ── Build ───────────────────────────────────────────────────────────────
      # Every target builds with an explicit --target, so the output is always at
      # target/<target>/release/ regardless of the host (native or cross).
      - name: Build release binary
        run: cargo build --locked --release -p colosseum-gui --bin colosseum --target ${{ matrix.target }}

      # ── Smoke test — verify the binary was produced and is a real binary ───
      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          bin="target/${{ matrix.target }}/release/colosseum"
          test -f "$bin"   || { echo "ERROR: binary missing at $bin"; exit 1; }
          size=$(wc -c < "$bin")
          echo "Binary size: ${size} bytes"
          # A real egui+chess binary should comfortably exceed 2 MB
          test "$size" -gt 2097152 || { echo "ERROR: binary too small (${size} B)"; exit 1; }
          file "$bin" || true   # print ELF/Mach-O header for diagnosis

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target\${{ matrix.target }}\release\colosseum.exe"
          if (-not (Test-Path $bin)) { Write-Error "ERROR: binary missing at $bin"; exit 1 }
          $size = (Get-Item $bin).Length
          Write-Host "Binary size: $size bytes"
          if ($size -lt 2MB) { Write-Error "ERROR: binary too small ($size B)"; exit 1 }

      # ── Windows: portable ZIP ───────────────────────────────────────────────
      - name: Package ZIP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '${{ needs.validate.outputs.version }}'
          $name = "colosseum-${version}-${{ matrix.platform }}-${{ matrix.arch }}"
          New-Item -ItemType Directory -Path "staging\$name" | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\colosseum.exe" "staging\$name\colosseum.exe"
          Copy-Item "LICENSE"                                            "staging\$name\LICENSE"
          Compress-Archive -Path "staging\$name" -DestinationPath "${name}.zip"
          "ARTIFACT_ZIP=${name}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ── Windows: MSI installer via WiX 5 ───────────────────────────────────
      # WiX is a cross-platform .NET tool; a single main.wxs builds both x64 and
      # arm64 — the architecture is chosen by the -arch flag below. .NET SDK is
      # preinstalled on the GitHub Windows images; setup-dotnet pins a known good
      # version on both x64 and Arm runners.
      - name: Install .NET SDK (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'

      - name: Build MSI (Windows)
        if: runner.os == 'Windows' && needs.validate.outputs.prerelease != 'true'
        shell: pwsh
        run: |
          # Latest WiX (v7+). The OSMF EULA v1.1 must be accepted before any
          # command runs (WIX7015 otherwise; the unversioned extension add is
          # also gated behind it, surfacing as WIX0144). Accepting is the
          # documented CI mechanism; the maintenance fee only applies from
          # US$10,000/yr of revenue on projects using WiX — Colosseum is free
          # software, so the fee is zero.
          dotnet tool install --global wix --version 7.0.0
          # Ensure the global tools dir is on PATH for this step.
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix eula accept wix7
          wix extension add -g WixToolset.UI.wixext

          $version = '${{ needs.validate.outputs.version }}'
          $ver    = ($version -split '-')[0]
          $binDir = (Resolve-Path "target\${{ matrix.target }}\release").Path
          $dest   = "colosseum-${version}-${{ matrix.platform }}-${{ matrix.arch }}.msi"

          wix build "crates\colosseum-gui\wix\main.wxs" `
            -arch ${{ matrix.wix_arch }} `
            -d Version="$ver" `
            -d BinDir="$binDir" `
            -d ProjectRoot="${{ github.workspace }}" `
            -ext WixToolset.UI.wixext `
            -o "$dest"

          if (-not (Test-Path $dest)) { Write-Error "ERROR: MSI not produced"; exit 1 }
          "ARTIFACT_MSI=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ── Linux: tar.gz ───────────────────────────────────────────────────────
      - name: Package tar.gz (Linux)
        if: runner.os == 'Linux'
        run: |
          version='${{ needs.validate.outputs.version }}'
          name="colosseum-${version}-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "staging/${name}"
          cp "target/${{ matrix.target }}/release/colosseum" "staging/${name}/colosseum"
          cp LICENSE                                          "staging/${name}/LICENSE"
          tar -C staging -czf "${name}.tar.gz" "${name}"
          echo "ARTIFACT_TGZ=${name}.tar.gz" >> "$GITHUB_ENV"

      # ── Linux: .deb + .rpm ──────────────────────────────────────────────────
      # Package the binary already built above (--no-build); asset lists and
      # metadata live in crates/colosseum-gui/Cargo.toml
      # ([package.metadata.deb] / [package.metadata.generate-rpm]).
      - name: Package .deb and .rpm (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --version 3.7.0 --locked
          cargo install cargo-generate-rpm --version 0.21.0 --locked
          version='${{ needs.validate.outputs.version }}'
          base="colosseum-${version}-${{ matrix.platform }}-${{ matrix.arch }}"

          cargo deb -p colosseum-gui --no-build --target ${{ matrix.target }} \
            -o "${base}.deb"
          test -f "${base}.deb" || { echo "ERROR: .deb not produced"; exit 1; }
          echo "ARTIFACT_DEB=${base}.deb" >> "$GITHUB_ENV"

          cargo generate-rpm -p crates/colosseum-gui --target ${{ matrix.target }} \
            -o "${base}.rpm"
          test -f "${base}.rpm" || { echo "ERROR: .rpm not produced"; exit 1; }
          echo "ARTIFACT_RPM=${base}.rpm" >> "$GITHUB_ENV"

      # ── macOS: tar.gz ───────────────────────────────────────────────────────
      - name: Package tar.gz (macOS)
        if: runner.os == 'macOS'
        run: |
          version='${{ needs.validate.outputs.version }}'
          name="colosseum-${version}-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "staging/${name}"
          cp "target/${{ matrix.target }}/release/colosseum" "staging/${name}/colosseum"
          cp LICENSE                                          "staging/${name}/LICENSE"
          tar -C staging -czf "${name}.tar.gz" "${name}"
          echo "ARTIFACT_TGZ=${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Smoke exact portable archive
        shell: pwsh
        run: |
          $extension = if ('${{ matrix.platform }}' -eq 'windows') { 'zip' } else { 'tar.gz' }
          ./tools/release/Smoke-GuiArchive.ps1 `
            -Archive "colosseum-${{ needs.validate.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.$extension" `
            -Version '${{ needs.validate.outputs.version }}' `
            -Platform '${{ matrix.platform }}' `
            -Architecture '${{ matrix.arch }}'

      # ── macOS: .app bundle (icon + Info.plist + ad-hoc signature) ──────────
      # A double-clickable, Finder-friendly bundle: it carries the app icon and
      # launches without a Terminal window (unlike the bare binary in the tarball).
      #
      # NOTE (signing): v1.0 ships unsigned / ad-hoc — users still get the
      # Gatekeeper "unidentified developer" prompt (right-click → Open once).
      # For a prompt-free install, sign + notarize with a Developer ID:
      #   codesign --deep --force --sign "Developer ID Application: ..." Colosseum.app
      #   xcrun notarytool submit colosseum.dmg --apple-id ... --wait
      # See docs/macos-signing.md for the full process.
      - name: Assemble .app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          ver='${{ needs.validate.outputs.version }}'
          app="dmg-staging/Colosseum.app"

          mkdir -p "${app}/Contents/MacOS" "${app}/Contents/Resources"
          cp "target/${{ matrix.target }}/release/colosseum" "${app}/Contents/MacOS/colosseum"

          # Generate colosseum.icns from the shipped 256px .ico (sips + iconutil,
          # both preinstalled on macOS runners) — same recipe as build_macos.sh.
          ico="crates/colosseum-gui/assets/colosseum.ico"
          iconset="$(mktemp -d)/colosseum.iconset"
          master="$(mktemp -t colosseum-icon).png"
          mkdir -p "$iconset"
          sips -s format png "$ico" --out "$master" >/dev/null
          for size in 16 32 128 256; do
            sips -z "$size" "$size"                 "$master" --out "$iconset/icon_${size}x${size}.png"    >/dev/null
            sips -z "$((size*2))" "$((size*2))"     "$master" --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "${app}/Contents/Resources/colosseum.icns"

          cat > "${app}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>    <string>colosseum</string>
            <key>CFBundleIconFile</key>      <string>colosseum</string>
            <key>CFBundleIdentifier</key>    <string>com.colosseum.Colosseum</string>
            <key>CFBundleName</key>          <string>Colosseum</string>
            <key>CFBundleDisplayName</key>   <string>Colosseum</string>
            <key>CFBundleVersion</key>       <string>${ver}</string>
            <key>CFBundleShortVersionString</key><string>${ver}</string>
            <key>CFBundlePackageType</key>   <string>APPL</string>
            <key>CFBundleSignature</key>     <string>????</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSSupportsAutomaticGraphicsSwitching</key><true/>
          </dict>
          </plist>
          PLIST

          # Ad-hoc sign the whole bundle (Apple Silicon refuses unsigned bundles).
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app" || true

      # ── macOS: DMG with drag-to-Applications layout ─────────────────────────
      # `create-dmg` builds a Finder window that shows the app icon next to an
      # /Applications shortcut so users can drag to install — the standard macOS
      # experience. If it fails (its AppleScript layout step is occasionally
      # flaky in CI), fall back to a plain hdiutil DMG that still contains the
      # /Applications symlink, so we always ship a functional installer.
      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          version='${{ needs.validate.outputs.version }}'
          dmg="colosseum-${version}-${{ matrix.platform }}-${{ matrix.arch }}.dmg"
          icns="dmg-staging/Colosseum.app/Contents/Resources/colosseum.icns"

          # The macOS runner image ships an untrusted third-party tap (aws/tap)
          # that makes every `brew` command print a noisy "tap trust is required"
          # warning. We don't use it, so drop it to keep the log clean.
          brew untap aws/tap >/dev/null 2>&1 || true
          brew install create-dmg

          # Retina-aware background: fold the 1x and 2x PNGs (icon slots match
          # the --icon/--app-drop-link coordinates below) into a multi-res TIFF.
          # Regenerate the PNGs with crates/colosseum-gui/assets/dmg/dmg_bg.swift.
          bgdir="crates/colosseum-gui/assets/dmg"
          tiffutil -cathidpicheck \
            "$bgdir/dmg-background.png" "$bgdir/dmg-background@2x.png" \
            -out dmg-background.tiff

          create-dmg \
            --volname "Colosseum ${version}" \
            --volicon "$icns" \
            --background dmg-background.tiff \
            --window-pos 200 120 \
            --window-size 640 400 \
            --icon-size 128 \
            --icon "Colosseum.app" 160 200 \
            --hide-extension "Colosseum.app" \
            --app-drop-link 480 200 \
            --no-internet-enable \
            "$dmg" \
            "dmg-staging/Colosseum.app" \
          || echo "create-dmg reported an error — will verify output below."

          if [ ! -f "$dmg" ]; then
            echo "create-dmg produced no DMG; falling back to hdiutil."
            ln -s /Applications "dmg-staging/Applications"
            hdiutil create \
              -volname "Colosseum ${version}" \
              -srcfolder "dmg-staging/" \
              -ov -format UDZO \
              "$dmg"
          fi

          test -f "$dmg" || { echo "ERROR: DMG not produced"; exit 1; }
          echo "ARTIFACT_DMG=${dmg}" >> "$GITHUB_ENV"

      # ── Upload artifacts (separate steps so missing ones are skipped) ───────
      - name: Upload ZIP
        if: env.ARTIFACT_ZIP != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zip-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.ARTIFACT_ZIP }}

      - name: Upload MSI
        if: env.ARTIFACT_MSI != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: msi-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.ARTIFACT_MSI }}

      - name: Upload TGZ
        if: env.ARTIFACT_TGZ != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tgz-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.ARTIFACT_TGZ }}

      - name: Upload DEB
        if: env.ARTIFACT_DEB != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deb-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.ARTIFACT_DEB }}

      - name: Upload RPM
        if: env.ARTIFACT_RPM != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rpm-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.ARTIFACT_RPM }}

      - name: Upload DMG
        if: env.ARTIFACT_DMG != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dmg-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.ARTIFACT_DMG }}

  # ────────────────────────────────────────────────────────────────────────────
  # Arch Linux package (.pkg.tar.zst, installable with `pacman -U`) — built in
  # an Arch container because makepkg only exists there. Covers Arch and its
  # derivatives (CachyOS, EndeavourOS, Manjaro, …).
  # ────────────────────────────────────────────────────────────────────────────
  build-arch:
    name: Build (x86_64 Arch package)
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      # base-devel has the toolchain and makepkg; add rust + the same GUI build
      # deps the Ubuntu leg installs (gtk3 for the rfd file dialogs, xkbcommon
      # for winit).
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git rust gtk3 libxkbcommon openssl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-arch-x86_64

      - name: Build release binary
        run: cargo build --locked --release -p colosseum-gui --bin colosseum

      - name: Smoke test
        run: |
          bin="target/release/colosseum"
          test -f "$bin"   || { echo "ERROR: binary missing at $bin"; exit 1; }
          size=$(wc -c < "$bin")
          echo "Binary size: ${size} bytes"
          test "$size" -gt 2097152 || { echo "ERROR: binary too small (${size} B)"; exit 1; }

      # Package the prebuilt binary with a generated PKGBUILD. makepkg refuses
      # to run as root (the container's default user), so the build dir is
      # handed to an unprivileged user first.
      - name: Package .pkg.tar.zst
        run: |
          version='${{ needs.validate.outputs.version }}'
          # pkgver may not contain hyphens (1.0.2-rc.1 -> 1.0.2_rc.1).
          pkgver="$(echo "$version" | tr '-' '_')"

          mkdir -p pkgbuild
          cp target/release/colosseum        pkgbuild/colosseum
          cp packaging/colosseum.desktop     pkgbuild/colosseum.desktop
          cp packaging/colosseum.png         pkgbuild/colosseum.png
          cp LICENSE                         pkgbuild/LICENSE

          cat > pkgbuild/PKGBUILD <<EOF
          pkgname=colosseum
          pkgver=${pkgver}
          pkgrel=1
          pkgdesc="UCI chess engine tournament GUI"
          arch=('x86_64')
          url="https://github.com/maelic13/colosseum"
          license=('GPL-3.0-or-later')
          depends=('gtk3' 'libxkbcommon')
          # Arch builds a companion -debug package by default; a release
          # binary carries no debug symbols, so it would only be an empty
          # second package that confuses the asset glob below.
          options=('!debug')
          source=('colosseum' 'colosseum.desktop' 'colosseum.png' 'LICENSE')
          sha256sums=('SKIP' 'SKIP' 'SKIP' 'SKIP')

          package() {
            install -Dm755 "\$srcdir/colosseum"         "\$pkgdir/usr/bin/colosseum"
            install -Dm644 "\$srcdir/colosseum.desktop" "\$pkgdir/usr/share/applications/colosseum.desktop"
            install -Dm644 "\$srcdir/colosseum.png"     "\$pkgdir/usr/share/icons/hicolor/256x256/apps/colosseum.png"
            install -Dm644 "\$srcdir/LICENSE"           "\$pkgdir/usr/share/licenses/colosseum/LICENSE"
          }
          EOF

          useradd -m builder
          chown -R builder pkgbuild
          su builder -c 'cd pkgbuild && makepkg --nodeps'

          # Exact name, not a glob: makepkg names packages
          # <pkgname>-<pkgver>-<pkgrel>-<arch>.pkg.tar.zst, and a glob would
          # silently pick up any companion package makepkg decides to build.
          built="pkgbuild/colosseum-${pkgver}-1-x86_64.pkg.tar.zst"
          test -f "$built" || {
            echo "ERROR: expected $built; makepkg produced:"
            ls -1 pkgbuild/*.pkg.tar.zst || true
            exit 1
          }
          dest="colosseum-${version}-linux-x86_64.pkg.tar.zst"
          mv "$built" "$dest"
          test -f "$dest" || { echo "ERROR: Arch package not produced"; exit 1; }
          echo "ARTIFACT_PKG=$dest" >> "$GITHUB_ENV"

      - name: Upload Arch package
        if: env.ARTIFACT_PKG != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pkg-linux-arch-x86_64
          path: ${{ env.ARTIFACT_PKG }}

  # ────────────────────────────────────────────────────────────────────────────
  # Collect all platform artifacts and attach them to the triggering release
  # ────────────────────────────────────────────────────────────────────────────
  publish:
    name: Verify and publish GUI release
    needs: [validate, build, build-arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: '*'
          merge-multiple: true
          path: release-artifacts

      - name: List release artifacts
        run: ls -lh release-artifacts/

      - name: Generate and verify checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Extract GUI-owned release notes
        run: cargo run --locked -q -p colosseum-release -- notes "$GITHUB_REF_NAME" release-artifacts/RELEASE-NOTES.md

      - name: Publish product-scoped release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: Colosseum GUI v${{ needs.validate.outputs.version }}
          body_path: release-artifacts/RELEASE-NOTES.md
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          files: |
            release-artifacts/colosseum-*
            release-artifacts/SHA256SUMS
