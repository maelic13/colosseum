[package]
name = "colosseum-uci"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Explicit local interoperability coverage only. Required CI never enables it.
real-engine-smoke = []

[dependencies]
colosseum-application = { path = "../colosseum-application" }
colosseum-core = { path = "../colosseum-core" }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"

[[test]]
name = "uci_smoke"
path = "tests/stockfish.rs"
required-features = ["real-engine-smoke"]
