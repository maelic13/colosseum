[package]
name = "colosseum-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Chess engine testing suite — run tournaments, track Elo, view live results"
keywords = ["chess", "engine", "tournament", "uci", "gui"]
categories = ["games"]

[[bin]]
name = "colosseum"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
colosseum-core = { version = "0.1.0", path = "../colosseum-core" }
colosseum-engine = { version = "0.1.0", path = "../colosseum-engine" }
crossbeam-channel = "0.5.15"
eframe = "0.34.3"
egui = "0.34.3"
egui_extras = "0.34.3"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
shakmaty = "0.30.0"
serde_json = "1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
