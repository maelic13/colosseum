[package]
name = "colosseum-cli"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Headless chess-engine testing and experiment harness"
keywords = ["chess", "engine", "testing", "uci", "sprt"]
categories = ["command-line-utilities", "games"]

[[bin]]
name = "colosseum-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
colosseum-application = { path = "../colosseum-application" }
colosseum-core = { path = "../colosseum-core" }
colosseum-engine = { path = "../colosseum-engine" }
colosseum-uci = { path = "../colosseum-uci" }
dunce = "1.0.5"
getrandom = "0.3.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time"] }
toml = "1.0.6"
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
