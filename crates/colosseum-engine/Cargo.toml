[package]
name = "colosseum-engine"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Explicit local interoperability coverage only. Required CI never enables it.
real-engine-smoke = []

[dependencies]
anyhow = "1.0.102"
colosseum-application = { path = "../colosseum-application" }
colosseum-core = { path = "../colosseum-core" }
colosseum-uci = { path = "../colosseum-uci" }
crossbeam-channel = "0.5.15"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
shakmaty = "0.30.0"
thiserror = "2.0.18"
time = "0.3.47"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tracing = "0.1.44"
uuid = { version = "1.23.2", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"

[[test]]
name = "runner_smoke"
path = "tests/runner.rs"
required-features = ["real-engine-smoke"]

[[test]]
name = "scheduler_smoke"
path = "tests/scheduler.rs"
required-features = ["real-engine-smoke"]
