    <rect x="440" y="60" width="72" height="32" rx="6" fill="#d9a54f" fill-opacity="0.16" stroke="#d9a54f" stroke-opacity="0.45"/>
    <text x="476" y="80" fill="#d9a54f" text-anchor="middle">⏸ Stop</text>
    <rect x="522" y="60" width="110" height="32" rx="6" fill="#db5d52" fill-opacity="0.16" stroke="#db5d52" stroke-opacity="0.45"/>
    <text x="577" y="80" fill="#db5d52" text-anchor="middle">⏹ Force-Stop</text>
  </g>

  <text x="660" y="81" fill="#97a1b1" font-size="13">128 / 240 games</text>
  <rect x="768" y="73" width="160" height="6" rx="3" fill="#0e1116"/>
  <rect x="768" y="73" width="85" height="6" rx="3" fill="#e0a93b"/>

  <rect x="948" y="62" width="108" height="28" rx="6" fill="#232934" stroke="#323a47"/>
  <text x="1002" y="80" fill="#e7eaf0" font-size="12.5" text-anchor="middle">Head-to-head</text>
  <line x1="0" y1="104" x2="1100" y2="104" stroke="#323a47"/>

  <!-- ── Results table ── -->
  <!-- header -->
  <rect x="20" y="120" width="1060" height="30" rx="6" fill="#232934"/>
  <g font-size="12" font-weight="600" fill="#97a1b1">
    <text x="40" y="139">#</text>
    <text x="80" y="139">Engine</text>
    <text x="330" y="139">Ver</text>
    <text x="430" y="139" fill="#e0a93b">Elo ▼</text>
    <text x="540" y="139">Δ</text>
    <text x="640" y="139">Pts</text>
    <text x="730" y="139">Gms</text>
    <text x="820" y="139">W-D-L</text>
    <text x="960" y="139">Avg nps</text>
  </g>

