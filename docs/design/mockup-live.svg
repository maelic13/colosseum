    <text x="80" y="169" fill="#e7eaf0" font-weight="600">Stockfish 17</text>
    <text x="330" y="169" fill="#97a1b1" font-size="12.5">17.0</text>
    <text x="430" y="169" fill="#e7eaf0" font-family="JetBrains Mono, monospace">2148</text>
    <rect x="528" y="155" width="44" height="20" rx="4" fill="#5fb873" fill-opacity="0.16"/>
    <text x="550" y="169" fill="#5fb873" font-family="JetBrains Mono, monospace" font-size="12" text-anchor="middle">+48</text>
    <text x="640" y="169" fill="#e0a93b" font-weight="600" font-family="JetBrains Mono, monospace">38.5</text>
    <text x="730" y="169" fill="#97a1b1" font-family="JetBrains Mono, monospace">48</text>
    <text x="820" y="169" fill="#e7eaf0" font-family="JetBrains Mono, monospace">31-15-2</text>
    <text x="960" y="169" fill="#97a1b1" font-family="JetBrains Mono, monospace">1.8M</text>

    <!-- row 2 -->
    <circle cx="46" cy="195" r="9" fill="#aab4c4" fill-opacity="0.2" stroke="#aab4c4" stroke-opacity="0.5"/>
    <text x="46" y="199" fill="#aab4c4" font-size="11" font-weight="600" text-anchor="middle">2</text>
    <text x="80" y="199" fill="#e7eaf0" font-weight="600">Berserk 13</text>
    <text x="330" y="199" fill="#97a1b1" font-size="12.5">13.0</text>
    <text x="430" y="199" fill="#e7eaf0" font-family="JetBrains Mono, monospace">2071</text>
    <rect x="528" y="185" width="44" height="20" rx="4" fill="#5fb873" fill-opacity="0.16"/>
    <text x="550" y="199" fill="#5fb873" font-family="JetBrains Mono, monospace" font-size="12" text-anchor="middle">+11</text>
    <text x="640" y="199" fill="#e0a93b" font-weight="600" font-family="JetBrains Mono, monospace">29.0</text>
    <text x="730" y="199" fill="#97a1b1" font-family="JetBrains Mono, monospace">48</text>
    <text x="820" y="199" fill="#e7eaf0" font-family="JetBrains Mono, monospace">22-14-12</text>
    <text x="960" y="199" fill="#97a1b1" font-family="JetBrains Mono, monospace">2.4M</text>

    <!-- row 3 -->
    <rect x="20" y="210" width="1060" height="30" fill="#1f242d"/>
    <circle cx="46" cy="225" r="9" fill="#c08255" fill-opacity="0.2" stroke="#c08255" stroke-opacity="0.5"/>
    <text x="46" y="229" fill="#c08255" font-size="11" font-weight="600" text-anchor="middle">3</text>
    <text x="80" y="229" fill="#e7eaf0" font-weight="600">Ethereal 14</text>
    <text x="330" y="229" fill="#97a1b1" font-size="12.5">14.25</text>
    <text x="430" y="229" fill="#e7eaf0" font-family="JetBrains Mono, monospace">1994</text>
    <text x="550" y="229" fill="#6c7686" font-family="JetBrains Mono, monospace" font-size="12" text-anchor="middle">0</text>
    <text x="640" y="229" fill="#e0a93b" font-weight="600" font-family="JetBrains Mono, monospace">21.5</text>
    <text x="730" y="229" fill="#97a1b1" font-family="JetBrains Mono, monospace">47</text>
    <text x="820" y="229" fill="#e7eaf0" font-family="JetBrains Mono, monospace">15-13-19</text>
    <text x="960" y="229" fill="#97a1b1" font-family="JetBrains Mono, monospace">1.1M</text>

    <!-- row 4 -->
    <text x="46" y="259" fill="#6c7686" font-family="JetBrains Mono, monospace" font-size="12" text-anchor="middle">4</text>
    <text x="80" y="259" fill="#e7eaf0" font-weight="600">Rustic Alpha</text>
    <text x="330" y="259" fill="#97a1b1" font-size="12.5">3.0</text>
    <text x="430" y="259" fill="#e7eaf0" font-family="JetBrains Mono, monospace">1822</text>
    <rect x="528" y="245" width="44" height="20" rx="4" fill="#db5d52" fill-opacity="0.16"/>
    <text x="550" y="259" fill="#db5d52" font-family="JetBrains Mono, monospace" font-size="12" text-anchor="middle">−59</text>
    <text x="640" y="259" fill="#e0a93b" font-weight="600" font-family="JetBrains Mono, monospace">9.0</text>
    <text x="730" y="259" fill="#97a1b1" font-family="JetBrains Mono, monospace">47</text>
    <text x="820" y="259" fill="#e7eaf0" font-family="JetBrains Mono, monospace">5-8-34</text>
    <text x="960" y="259" fill="#97a1b1" font-family="JetBrains Mono, monospace">640k</text>
  </g>

  <!-- ── Head-to-head card ── -->
  <rect x="20" y="296" width="520" height="160" rx="8" fill="#232934" stroke="#323a47"/>
  <text x="36" y="322" fill="#e7eaf0" font-size="14" font-weight="600">Head-to-head</text>
  <text x="36" y="338" fill="#97a1b1" font-size="11.5">Row engine's W–D–L against each column engine.</text>
  <g font-size="11.5" font-family="JetBrains Mono, monospace">
    <text x="200" y="362" fill="#97a1b1" text-anchor="middle" font-family="Inter">Stockf…</text>
    <text x="300" y="362" fill="#97a1b1" text-anchor="middle" font-family="Inter">Berserk</text>
    <text x="400" y="362" fill="#97a1b1" text-anchor="middle" font-family="Inter">Ethereal</text>
    <text x="36" y="386" fill="#e7eaf0" font-family="Inter" font-size="12" font-weight="600">Stockfish 17</text>
    <text x="200" y="386" fill="#6c7686" text-anchor="middle">—</text>
    <rect x="270" y="371" width="60" height="20" rx="4" fill="#5fb873" fill-opacity="0.20"/>
    <text x="300" y="386" fill="#e7eaf0" text-anchor="middle">10-4-2</text>
    <rect x="370" y="371" width="60" height="20" rx="4" fill="#5fb873" fill-opacity="0.24"/>
    <text x="400" y="386" fill="#e7eaf0" text-anchor="middle">12-3-1</text>
    <text x="36" y="414" fill="#e7eaf0" font-family="Inter" font-size="12" font-weight="600">Berserk 13</text>
    <rect x="170" y="399" width="60" height="20" rx="4" fill="#db5d52" fill-opacity="0.20"/>
    <text x="200" y="414" fill="#e7eaf0" text-anchor="middle">2-4-10</text>
    <text x="300" y="414" fill="#6c7686" text-anchor="middle">—</text>
    <rect x="370" y="399" width="60" height="20" rx="4" fill="#5fb873" fill-opacity="0.10"/>
    <text x="400" y="414" fill="#e7eaf0" text-anchor="middle">7-5-4</text>
    <text x="36" y="442" fill="#e7eaf0" font-family="Inter" font-size="12" font-weight="600">Ethereal 14</text>
    <rect x="170" y="427" width="60" height="20" rx="4" fill="#db5d52" fill-opacity="0.24"/>
    <text x="200" y="442" fill="#e7eaf0" text-anchor="middle">1-3-12</text>
    <rect x="270" y="427" width="60" height="20" rx="4" fill="#db5d52" fill-opacity="0.10"/>
    <text x="300" y="442" fill="#e7eaf0" text-anchor="middle">4-5-7</text>
    <text x="400" y="442" fill="#6c7686" text-anchor="middle">—</text>
  </g>

  <!-- ── Engine errors card ── -->
  <rect x="560" y="296" width="520" height="92" rx="8" fill="#db5d52" fill-opacity="0.08" stroke="#db5d52" stroke-opacity="0.35"/>
  <text x="576" y="322" fill="#db5d52" font-size="12.5" font-weight="600">Engine errors (2)</text>
  <text x="576" y="344" fill="#97a1b1" font-size="12">Rustic Alpha: bestmove timeout after 5000 ms (game 117)</text>
  <text x="576" y="362" fill="#97a1b1" font-size="12">Rustic Alpha: process exited unexpectedly (game 96)</text>

  <!-- ── Status bar ── -->
  <line x1="0" y1="624" x2="1100" y2="624" stroke="#323a47"/>
  <rect x="0" y="624" width="1100" height="36" fill="#12151b"/>
  <rect x="14" y="631" width="86" height="22" rx="11" fill="#5fb873" fill-opacity="0.16" stroke="#5fb873" stroke-opacity="0.45"/>
  <circle cx="30" cy="642" r="3" fill="#5fb873"/>
  <text x="40" y="646" fill="#5fb873" font-size="11.5" font-weight="600">Running</text>
  <text x="1086" y="646" fill="#6c7686" font-size="12" text-anchor="end">4 engines · v0.1.0</text>
</svg>
