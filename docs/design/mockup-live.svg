<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" font-family="Inter, Segoe UI, sans-serif">
  <!-- App background -->
  <rect width="1100" height="660" rx="10" fill="#1a1e26"/>

  <!-- ── Header ── -->
  <rect width="1100" height="48" fill="#12151b"/>
  <line x1="0" y1="48" x2="1100" y2="48" stroke="#323a47"/>
  <circle cx="30" cy="24" r="8.5" fill="none" stroke="#e0a93b" stroke-width="2.2"/>
  <circle cx="30" cy="24" r="4" fill="none" stroke="#b8882f" stroke-width="1.8"/>
  <text x="48" y="30" fill="#e7eaf0" font-size="17" font-weight="600">Colosseum</text>
  <rect x="170" y="10" width="106" height="28" rx="14" fill="#e0a93b" fill-opacity="0.18"/>
  <text x="223" y="28" fill="#f2c15e" font-size="14" font-weight="600" text-anchor="middle">Tournament</text>
  <text x="324" y="28" fill="#97a1b1" font-size="14" text-anchor="middle">Engines</text>
  <rect x="978" y="12" width="90" height="24" rx="12" fill="#5fb873" fill-opacity="0.16" stroke="#5fb873" stroke-opacity="0.45"/>
  <circle cx="996" cy="24" r="3.5" fill="#5fb873"/>
  <text x="1006" y="28" fill="#5fb873" font-size="12" font-weight="600">Running</text>

  <!-- ── Live control bar ── -->
  <rect x="0" y="48" width="1100" height="56" fill="#12151b" fill-opacity="0.6"/>
  <rect x="20" y="64" width="90" height="24" rx="12" fill="#5fb873" fill-opacity="0.16" stroke="#5fb873" stroke-opacity="0.45"/>
  <circle cx="38" cy="76" r="3.5" fill="#5fb873"/>
  <text x="48" y="80" fill="#5fb873" font-size="12" font-weight="600">Running</text>
  <text x="124" y="81" fill="#e7eaf0" font-size="15" font-weight="600">Round Robin — blitz gauntlet</text>

  <g font-size="13.5" font-weight="600">
    <rect x="368" y="60" width="62" height="32" rx="6" fill="#5fb873" fill-opacity="0.07" stroke="#5fb873" stroke-opacity="0.2"/>
